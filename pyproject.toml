[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rsiloop"
version = "0.3.0"
description = "Containment-hardened evaluation and statistical simulation framework for Level 1 Recursive Self-Improvement (RSI) research."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Heikki Hämäläinen and RSILoop Contributors" }
]
dependencies = [
  "numpy>=1.26.0",
]

[project.optional-dependencies]
providers = [
  "openai>=1.0.0",
  "anthropic>=0.20.0",
  "google-genai>=0.3.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["campaign2*", "campaign3*", "discovery_probe*", "scripts*"]
